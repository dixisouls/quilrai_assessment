[project]
name = "quilr-assessment"
version = "0.1.0"
description = "QuilrAI assessment: MCP server, MCP security gateway, LLM gateway guardrails and routing"
requires-python = ">=3.12,<3.13"
dependencies = ["quilr-common", "task1-mcp-server", "task2-mcp-gateway", "task3-pii-guardrail"]

[dependency-groups]
dev = [
    "pytest>=9.2,<10",
    "pytest-asyncio>=1.4,<2",
    "pytest-cov>=7.1,<8",
    "hypothesis>=6.170,<7",
    "ruff>=0.17,<0.18",
    "mypy>=2.4,<3",
    "pip-audit>=2.10,<3",
    "pre-commit>=4.7,<5",
]

[tool.uv]
package = false
# One toolchain everywhere: setup-uv in CI reads this, local runs enforce it.
required-version = "==0.13.6"

[tool.uv.workspace]
members = ["common", "task1-mcp-server", "task2-mcp-gateway", "task3-pii-guardrail"]

[tool.uv.sources]
quilr-common = { workspace = true }
task1-mcp-server = { workspace = true }
task2-mcp-gateway = { workspace = true }
task3-pii-guardrail = { workspace = true }

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = [
    "common/tests", "scripts/tests", "task1-mcp-server/tests", "task2-mcp-gateway/tests",
    "task3-pii-guardrail/tests",
]
pythonpath = ["scripts"]
markers = [
    "live: hits real external providers; skipped unless the relevant API key is set",
    "integration: spawns real processes / sockets",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
# Integration tests spawn real server processes; measure those too.
patch = ["subprocess"]
parallel = true
source = ["quilr_common", "scripts", "task1_mcp_server", "task2_mcp_gateway", "task3_pii_guardrail"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ['if __name__ == "__main__":']

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".code-review-graph"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "A", "C4", "SIM", "RET", "PTH", "T20", "ASYNC", "RUF", "BLE", "TRY", "PL"]
ignore = ["TRY003", "PLR0913"]

[tool.ruff.lint.isort]
known-first-party = [
    "quilr_common", "task1_mcp_server", "task2_mcp_gateway", "task3_pii_guardrail",
    "check_bidi", "check_commits",
]

[tool.ruff.lint.per-file-ignores]
# assert is the pytest idiom; magic values are fine in test expectations.
# TRY301: tests raise inside try on purpose to exercise exception logging.
# PLR0917: pytest injects fixtures positionally; parametrized tests need several.
"**/tests/**" = ["S101", "PLR2004", "S105", "S106", "TRY301", "PLR0917"]

[tool.mypy]
strict = true
files = [
    "common/src", "common/tests", "scripts",
    "task1-mcp-server/src", "task1-mcp-server/tests",
    "task2-mcp-gateway/src", "task2-mcp-gateway/tests",
    "task3-pii-guardrail/src", "task3-pii-guardrail/tests",
]
mypy_path = "common/src:task1-mcp-server/src:task2-mcp-gateway/src:task3-pii-guardrail/src:scripts"
explicit_package_bases = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
