[project]
name = "quilr-common"
version = "0.1.0"
description = "Shared foundations: structured JSON logging, redaction, tamper-evident audit trail"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quilr_common"]
